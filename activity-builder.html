<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مركز إعداد الأنشطة</title>
<style>
:root{--p:#00796b;--pd:#004d40;--accent:#ff7043;--ok:#2e7d32;--danger:#c62828;--bg:#edf7f5;--line:#d5e5e2;--muted:#657875}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#dff3ef,#f9fbfa);color:#183532;font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}.page{margin:28px auto;max-width:1120px;padding:0 14px}.hero{background:linear-gradient(135deg,var(--p),var(--pd));border-radius:22px;box-shadow:0 15px 35px rgba(0,77,64,.18);color:#fff;padding:28px;text-align:center}.hero h1{font-size:clamp(1.8rem,4vw,2.7rem);margin:0 0 8px}.hero p{color:#dcfffa;line-height:1.8;margin:0}.home{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:10px;color:#fff;display:inline-block;margin-top:14px;padding:8px 14px;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(23,69,66,.08);margin-top:20px;padding:22px}.card h2{color:var(--pd);margin-top:0}.activity-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}.activity-option{background:#f7fbfa;border:2px solid var(--line);border-radius:14px;cursor:pointer;min-height:135px;padding:18px;text-align:center}.activity-option strong{display:block;margin:7px 0}.activity-option .icon{font-size:2.2rem}.activity-option.active{background:#e7f5f2;border-color:var(--p);box-shadow:0 6px 18px rgba(0,121,107,.13)}.activity-option:disabled{cursor:not-allowed;opacity:.55}.soon{background:#eef1f0;border-radius:20px;color:var(--muted);font-size:.76rem;padding:3px 8px}.grid{display:grid;gap:15px;grid-template-columns:repeat(2,minmax(0,1fr))}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-weight:700}input,select,textarea{border:1px solid #b8ceca;border-radius:10px;outline:none;padding:11px 13px;width:100%}textarea{min-height:85px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(0,121,107,.12)}.question{background:#f8fcfb;border:1px solid var(--line);border-radius:14px;margin-top:14px;padding:18px}.question h3{color:var(--p);margin-top:0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.btn{border:0;border-radius:10px;color:#fff;cursor:pointer;font-weight:700;min-height:44px;padding:10px 17px}.primary{background:var(--p)}.accent{background:var(--accent)}.success{background:var(--ok)}.danger{background:var(--danger)}.light{background:#dcefeb;color:var(--pd)}.message{border-radius:10px;display:none;font-weight:700;margin-top:14px;padding:12px}.message.success{background:#e3f5e9;color:#165c35;display:block}.message.error{background:#ffebed;color:#92262e;display:block}.note{color:var(--muted);font-size:.9rem;line-height:1.8}.hidden{display:none!important}@media(max-width:700px){.page{margin:14px auto}.hero,.card{padding:17px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.btn{width:100%}}
</style>
</head>
<body>
<main class="page">
<header class="hero"><h1>🧩 مركز إعداد الأنشطة</h1><p>اختر النشاط، أضف الأسئلة والإجابات، ثم نزّل ملفًا محليًا لاستخدامه مع أي صف أو شعبة.</p><a class="home" href="main.html">🏠 العودة إلى الأنشطة</a></header>
<section class="card"><h2>1. اختر نوع النشاط</h2><div class="activity-grid"><button class="activity-option active" type="button" data-type="random"><span class="icon">🎯</span><strong>الاسم العشوائي</strong><span>جاهز للاستخدام</span></button><button class="activity-option" type="button" data-type="knowledge-race"><span class="icon">🏁</span><strong>سباق المعرفة</strong><span>جاهز للاستخدام</span></button><button class="activity-option" type="button" data-type="blockbusters"><span class="icon">🧩</span><strong>مسابقة الحروف</strong><span>جاهز للاستخدام</span></button><button class="activity-option" type="button" data-type="bomb-timer"><span class="icon">💣</span><strong>القنبلة المؤقتة</strong><span>جاهز للاستخدام</span></button><button class="activity-option" type="button" data-type="kingdoms"><span class="icon">🏆</span><strong>مملكة التحديات</strong><span>جاهز للاستخدام</span></button><button class="activity-option" type="button" data-type="team-challenge"><span class="icon">🥇</span><strong>تحدي الفرق</strong><span>جاهز للاستخدام</span></button><button class="activity-option" type="button" data-type="create-story"><span class="icon">✍️</span><strong>كوّن قصة</strong><span>جاهز للاستخدام</span></button><button class="activity-option" type="button" data-type="vote"><span class="icon">🗳️</span><strong>صوّت وقرّر</strong><span>جاهز للاستخدام</span></button><button class="activity-option" type="button" data-type="whois"><span class="icon">🕵️</span><strong>من هو؟</strong><span>جاهز للاستخدام</span></button><button class="activity-option" type="button" data-type="monopoly-oman"><span class="icon">🏘️</span><strong>مونوبولي عُمان</strong><span>جاهز للاستخدام</span></button><button class="activity-option" type="button" data-type="tower-game"><span class="icon">🗼</span><strong>برج الأسماء</strong><span>جاهز للاستخدام</span></button><button class="activity-option" type="button" data-type="pyramid-knowledge"><span class="icon">🔺</span><strong>هرم المعرفة</strong><span>جاهز للاستخدام</span></button></div></section>
<section class="card" id="builder"><h2>2. معلومات النشاط</h2><div class="grid"><div class="field"><label for="title">اسم النشاط *</label><input id="title" placeholder="مثال: مراجعة أجيال الحاسوب"></div><div class="field"><label for="subject">المادة</label><input id="subject" placeholder="مثال: تقنية المعلومات"></div><div class="field"><label for="grade">الصف المستهدف</label><select id="grade"><option value="">غير محدد</option><option>الخامس</option><option>السادس</option><option>السابع</option><option>الثامن</option><option>التاسع</option></select></div><div class="field"><label for="lesson">عنوان الدرس</label><input id="lesson" placeholder="مثال: أجيال الحاسوب"></div><div class="field"><label for="order">ترتيب الأسئلة</label><select id="order"><option value="random">عشوائي</option><option value="sequential">حسب الترتيب</option></select></div><div class="field"><label for="defaultTime">الزمن الافتراضي</label><select id="defaultTime"><option value="15">15 ثانية</option><option value="20">20 ثانية</option><option value="30" selected>30 ثانية</option><option value="45">45 ثانية</option><option value="60">60 ثانية</option></select></div></div></section>
<section class="card"><h2>3. الأسئلة والإجابات</h2><div id="questions"></div><div class="actions"><button class="btn primary" id="add" type="button">➕ إضافة سؤال</button></div><p class="note">لا تُحفظ أسماء الطلاب داخل الملف؛ يختار المعلم الصف والشعبة عند تشغيل النشاط.</p></section>
<section class="card"><h2>4. تنزيل النشاط</h2><div class="actions"><button class="btn success" id="download" type="button">⬇️ تنزيل ملف النشاط</button><button class="btn light" id="reset" type="button">🗑️ نشاط جديد</button></div><div class="message" id="message" role="status" aria-live="polite"></div></section>
</main>
<script>
"use strict";
const questions=document.getElementById("questions"),message=document.getElementById("message");let serial=0,activityType="random";
function input(tag,id,placeholder,type="text"){const e=document.createElement(tag);e.id=id;e.placeholder=placeholder;if(tag==="input")e.type=type;return e}
function field(labelText,control,full=false){const d=document.createElement("div");d.className=`field${full?" full":""}`;const l=document.createElement("label");l.htmlFor=control.id;l.textContent=labelText;d.append(l,control);return d}
function addQuestion(data={}){serial++;const card=document.createElement("article");card.className="question";const h=document.createElement("h3");h.textContent=`السؤال ${questions.children.length+1}`;const grid=document.createElement("div");grid.className="grid";const q=input("textarea",`q${serial}`,"اكتب السؤال"),a=input("textarea",`a${serial}`,"اكتب الإجابة النموذجية"),alt=input("input",`alt${serial}`,"إجابات بديلة تفصل بعلامة |"),hint=input("input",`hint${serial}`,"تلميح اختياري"),points=input("input",`points${serial}`,"10","number"),time=input("input",`time${serial}`,"30","number");q.className="q";a.className="a";alt.className="alt";hint.className="hint";points.className="points";time.className="time";q.value=data.question||"";a.value=data.answer||"";alt.value=(data.alternativeAnswers||[]).join(" | ");hint.value=data.hint||"";points.value=data.points||10;points.min=1;time.value=data.time||document.getElementById("defaultTime").value;time.min=5;grid.append(field("نص السؤال *",q,true),field("الإجابة النموذجية *",a,true),field("إجابات بديلة",alt),field("التلميح",hint),field("النقاط",points),field("الزمن بالثواني",time));const remove=document.createElement("button");remove.type="button";remove.className="btn danger";remove.textContent="حذف السؤال";remove.onclick=()=>{if(questions.children.length===1)return show("يجب وجود سؤال واحد على الأقل.","error");card.remove();renumber()};card.append(h,grid,remove);questions.append(card);renumber()}
function renumber(){[...questions.children].forEach((c,i)=>c.querySelector("h3").textContent=`السؤال ${i+1}`)}
function show(text,type){message.textContent=text;message.className=`message ${type}`}
function collect(){return[...questions.children].map((c,i)=>({id:`q${i+1}`,question:c.querySelector(".q").value.trim(),answer:c.querySelector(".a").value.trim(),alternativeAnswers:c.querySelector(".alt").value.split("|").map(x=>x.trim()).filter(Boolean),hint:c.querySelector(".hint").value.trim(),difficulty:"medium",points:Math.max(1,Number(c.querySelector(".points").value)||10),time:Math.max(5,Number(c.querySelector(".time").value)||30)}))}
function safeName(v){return v.replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,80)||"activity"}
function download(){const title=document.getElementById("title").value.trim(),list=collect();if(!title)return show("اكتب اسم النشاط.","error");if(list.some(x=>!x.question||!x.answer))return show("أكمل نص السؤال والإجابة لجميع الأسئلة.","error");const pack={format:"classact",version:"1.0",activityType,metadata:{title,subject:document.getElementById("subject").value.trim(),grade:document.getElementById("grade").value,lesson:document.getElementById("lesson").value.trim(),createdAt:new Date().toISOString()},settings:{questionOrder:document.getElementById("order").value,defaultTime:Number(document.getElementById("defaultTime").value),allowHints:true,repeatWrongQuestions:true},questions:list};const url=URL.createObjectURL(new Blob([JSON.stringify(pack,null,2)],{type:"application/json;charset=utf-8"})),link=document.createElement("a");link.href=url;link.download=`${safeName(title)}.classact`;document.body.append(link);link.click();link.remove();URL.revokeObjectURL(url);show(`تم تنزيل النشاط بنجاح ويحتوي على ${list.length} سؤالًا.`,"success")}
document.querySelectorAll(".activity-option[data-type]").forEach(button=>button.onclick=()=>{activityType=button.dataset.type;document.querySelectorAll(".activity-option[data-type]").forEach(item=>item.classList.toggle("active",item===button));show(`تم اختيار ${button.querySelector("strong").textContent}.`,"success")});document.getElementById("add").onclick=()=>addQuestion();document.getElementById("download").onclick=download;document.getElementById("reset").onclick=()=>{if(!confirm("مسح النشاط الحالي؟"))return;["title","subject","lesson"].forEach(id=>document.getElementById(id).value="");document.getElementById("grade").value="";document.getElementById("order").value="random";questions.replaceChildren();serial=0;addQuestion();show("تم إنشاء نشاط جديد.","success")};addQuestion();
</script>
</body>
</html>
